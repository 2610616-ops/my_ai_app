<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>폴리 선배 - 3D 그래픽 AI</title>
  <style>
    :root { --sky:#fff4f7; --blue:#e889a8; --deep:#a84c70; --ink:#5a4050; --white:#fff; --line:#f4c9d7; --user:#ffe1eb; --ai:#fffafd; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color:var(--ink); background:linear-gradient(135deg,#fff0f5,#fffafd 55%,#ffe4ed); }
    .app { width:min(960px,100%); margin:0 auto; min-height:100vh; display:flex; flex-direction:column; padding:18px; }
    header { background:rgba(255,255,255,.8); border:1px solid var(--line); border-radius:26px; padding:20px 22px; box-shadow:0 10px 28px rgba(55,140,180,.12); }
    .title-row { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    h1 { margin:0; color:var(--deep); font-size:clamp(1.35rem,3vw,2rem); }
    .subtitle { margin:7px 0 0; color:#5d7c8c; }
    button { border:0; border-radius:999px; padding:10px 14px; font-weight:700; cursor:pointer; color:var(--deep); background:#ffe1eb; transition:.2s; }
    button:hover { transform:translateY(-1px); background:#ffd0df; }
    #clearBtn { background:#fff0f5; color:#a84c70; }
    .status { margin-top:14px; padding:12px 14px; border-radius:16px; background:#f4fbff; border:1px solid var(--line); font-size:.92rem; }
    .progress-wrap { display:none; margin-top:10px; }
    progress { width:100%; height:12px; accent-color:var(--blue); }
    #progressText { display:block; margin-top:7px; color:#537383; white-space:pre-wrap; }
    main { flex:1; display:flex; flex-direction:column; min-height:0; margin-top:16px; }
    #chat { flex:1; overflow:auto; padding:4px 2px 16px; }
    .message { display:flex; margin:12px 0; }
    .message.user { justify-content:flex-end; }
    .bubble { max-width:min(78%,680px); padding:13px 16px; border-radius:20px; line-height:1.55; white-space:pre-wrap; overflow-wrap:anywhere; box-shadow:0 4px 12px rgba(53,130,165,.08); }
    .message.ai .bubble { background:var(--ai); border:1px solid var(--line); border-bottom-left-radius:7px; }
    .message.user .bubble { background:var(--user); border:1px solid #b6e4f7; border-bottom-right-radius:7px; }
    .label { font-size:.75rem; font-weight:800; color:#668897; margin:0 0 4px 5px; }
    .suggestions { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 12px; }
    .suggestions button { font-size:.88rem; background:#fff; border:1px solid var(--line); }
    form { display:flex; gap:10px; padding:12px; background:rgba(255,255,255,.8); border:1px solid var(--line); border-radius:22px; box-shadow:0 8px 24px rgba(55,140,180,.1); }
    textarea { flex:1; resize:none; min-height:48px; max-height:130px; border:1px solid var(--line); border-radius:16px; padding:13px; font:inherit; color:var(--ink); outline:none; background:#fbfeff; }
    textarea:focus { border-color:var(--blue); box-shadow:0 0 0 3px rgba(91,185,232,.16); }
    #sendBtn { min-width:78px; background:var(--blue); color:white; }
    #sendBtn:disabled, textarea:disabled { opacity:.55; cursor:not-allowed; }
    .hint { text-align:center; color:#6c8b99; font-size:.78rem; margin:9px 0 0; }
    @media (max-width:600px) { .app{padding:10px}.bubble{max-width:88%}.title-row{align-items:flex-start}.title-row button{padding:8px 10px;font-size:.8rem} form{padding:9px} }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="title-row">
        <div><h1>🦦 랏코 선배</h1><p class="subtitle">랏코와 함께 배우는 3D 그래픽</p></div>
        <button id="clearBtn" type="button">대화 지우기</button>
      </div>
      <div id="status" class="status">모델을 준비하고 있어요. 처음에는 모델 다운로드가 필요합니다.</div>
      <div id="progressWrap" class="progress-wrap"><progress id="progress" value="0" max="1"></progress><span id="progressText"></span></div>
    </header>

    <main>
      <section id="chat" aria-live="polite"></section>
      <div class="suggestions" id="suggestions">
        <button type="button" data-question="3D 그래픽을 처음 배울 때 무엇부터 시작하면 좋아요?">입문 순서 알려줘</button>
        <button type="button" data-question="폴리곤과 버텍스의 차이를 쉽게 설명해줘.">폴리곤과 버텍스 차이</button>
        <button type="button" data-question="Blender로 간단한 도넛을 만드는 과정을 알려줘.">Blender 도넛 만들기</button>
      </div>
      <form id="chatForm">
        <textarea id="input" placeholder="궁금한 3D 그래픽 질문을 입력하세요..." aria-label="질문 입력"></textarea>
        <button id="sendBtn" type="submit" disabled>보내기</button>
      </form>
      <p class="hint">대화 기록은 이 브라우저에만 저장됩니다.</p>
    </main>
  </div>

  <script type="module">
    import { CreateMLCEngine } from "https://esm.run/@mlc-ai/web-llm@0.2.87";

    const SYSTEM_PROMPT = `너는 치이카와의 랏코처럼 다정하고 용감하게 3D 그래픽을 알려주는 선배다.
고등학생도 이해할 수 있도록 어려운 개념을 쉬운 말과 예시로 설명한다.
모르는 내용은 솔직히 모른다고 말하고, 위험하거나 불법적인 행동은 안내하지 않는다.
항상 존댓말을 사용하고 사용자의 질문을 격려하며 답한다. 3~4문장 이내로 짧게 대답해.`;

    const chatEl = document.querySelector('#chat');
    const inputEl = document.querySelector('#input');
    const sendBtn = document.querySelector('#sendBtn');
    const form = document.querySelector('#chatForm');
    const statusEl = document.querySelector('#status');
    const progressWrap = document.querySelector('#progressWrap');
    const progressEl = document.querySelector('#progress');
    const progressTextEl = document.querySelector('#progressText');
    const clearBtn = document.querySelector('#clearBtn');
    const suggestions = document.querySelector('#suggestions');
    const STORAGE_KEY = 'poly-senior-history-v1';
    let history = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    let engine = null;
    let busy = false;

    function saveHistory() { localStorage.setItem(STORAGE_KEY, JSON.stringify(history)); }
    function addBubble(role, text) {
      const row = document.createElement('div'); row.className = `message ${role === 'user' ? 'user' : 'ai'}`;
      const wrap = document.createElement('div');
      const label = document.createElement('div'); label.className='label'; label.textContent = role === 'user' ? '나' : '랏코 선배';
      const bubble = document.createElement('div'); bubble.className='bubble'; bubble.textContent = text;
      wrap.append(label,bubble); row.append(wrap); chatEl.append(row); chatEl.scrollTop = chatEl.scrollHeight;
      return bubble;
    }
    function renderHistory() {
      chatEl.innerHTML = '';
      if (!history.length) addBubble('assistant','안녕하세요! 저는 랏코 선배예요. 3D 그래픽에 대해 궁금한 것을 편하게 물어보세요 🦦');
      else history.forEach(m => addBubble(m.role, m.content));
    }
    function setStatus(text, error=false) { statusEl.textContent=text; statusEl.style.color=error?'#b23b58':''; }

    async function init() {
      renderHistory();
      if (!navigator.gpu) { setStatus('WebGPU를 지원하지 않아요. Chrome 또는 Edge의 최신 버전에서 다시 시도해 보세요.', true); return; }
      try {
        progressWrap.style.display='block';
        setStatus('모델을 다운로드하고 있어요. 잠시 기다려 주세요.');
        const adapter = await navigator.gpu.requestAdapter();
        if (!adapter) throw new Error('WebGPU 어댑터를 찾을 수 없습니다.');
        const q = adapter.features.has("shader-f16") ? "q4f16_1" : "q4f32_1";
        const engine = await CreateMLCEngine(`Qwen3.5-2B-${q}-MLC`, {
          initProgressCallback: (p) => { /* p.progress(0~1)와 p.text를 화면에 표시 */
            progressEl.value = p.progress || 0;
            progressTextEl.textContent = `${Math.round((p.progress || 0) * 100)}% - ${p.text || ''}`;
          },
        });
        window.polyEngine = engine;
        progressWrap.style.display='none';
        setStatus('준비 완료! 질문을 입력해 보세요.');
        sendBtn.disabled=false; inputEl.disabled=false; inputEl.focus();
      } catch (error) { console.error(error); setStatus(`모델을 준비하지 못했어요: ${error.message}`, true); progressTextEl.textContent='새로고침 후 다시 시도해 주세요.'; }
    }

    async function ask(question) {
      if (!question || busy || !window.polyEngine) return;
      busy=true; sendBtn.disabled=true; inputEl.disabled=true; suggestions.style.pointerEvents='none';
      addBubble('user', question); history.push({role:'user', content:question}); saveHistory();
      const answerBubble = addBubble('assistant','');
      let answer='';
      try {
        const stream = await window.polyEngine.chat.completions.create({
          messages: [{ role: "system", content: SYSTEM_PROMPT }, ...history],
          stream: true,
          extra_body: { enable_thinking: false },
        });
        for await (const chunk of stream) {
          const piece = chunk.choices[0]?.delta?.content || "";
          answer += piece; answerBubble.textContent = answer; chatEl.scrollTop = chatEl.scrollHeight;
        }
        history.push({role:'assistant', content:answer}); saveHistory();
      } catch (error) { answerBubble.textContent = `답변 중 문제가 생겼어요: ${error.message}`; }
      finally { busy=false; sendBtn.disabled=false; inputEl.disabled=false; suggestions.style.pointerEvents='auto'; inputEl.focus(); }
    }

    form.addEventListener('submit', e => { e.preventDefault(); const q=inputEl.value.trim(); if(q){inputEl.value=''; ask(q);} });
    inputEl.addEventListener('keydown', e => { if(e.key==='Enter' && !e.shiftKey){e.preventDefault(); form.requestSubmit();} });
    suggestions.addEventListener('click', e => { const q=e.target.dataset.question; if(q){ inputEl.value=q; ask(q); } });
    clearBtn.addEventListener('click', () => { history=[]; saveHistory(); renderHistory(); });
    init();
  </script>
</body>
</html>
